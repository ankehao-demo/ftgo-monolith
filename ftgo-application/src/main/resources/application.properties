spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=${DB_USE_SSL:false}
spring.datasource.username=${DB_USERNAME:mysqluser}
spring.datasource.password=${DB_PASSWORD:mysqlpw}
spring.datasource.driver.class.name=com.mysql.jdbc.Driver
